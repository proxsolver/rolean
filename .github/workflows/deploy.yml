name: Deploy to Primary Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Deploy rolean.org
        working-directory: /home/harry/2026/rolean
        run: |
          echo "Pulling latest code..."
          git pull origin main

          echo "Installing dependencies..."
          npm install --production=false

          echo "Building production..."
          npm run build

          echo "Restarting PM2..."
          pm2 restart rolean || pm2 start npm --name "rolean" -- start -- -p 3090

          echo "Deploy complete!"
          pm2 status rolean
